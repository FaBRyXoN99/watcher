<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Watcher - Il tuo tracker personale premium per film e serie TV. Scopri dove guardare i tuoi titoli preferiti e dai voti con mezzi voti." />
    <title>Watcher - Tracker Personale di Film e Serie TV</title>
    <script>
      (function(){
        try {
          var icon = localStorage.getItem('watcher_app_icon_global');
          // Migrazione automatica da .svg a .png
          if (icon === 'logo.svg') {
            icon = 'logo.png';
            localStorage.setItem('watcher_app_icon_global', 'logo.png');
          } else if (icon && icon.endsWith('.svg') && !icon.startsWith('data:')) {
            icon = icon.replace('.svg', '.png');
            localStorage.setItem('watcher_app_icon_global', icon);
          }

          var pngCache = localStorage.getItem('watcher_app_icon_png_cache');
          var href = './logo.png'; // fallback default
          var type = 'image/png';
          
          if (icon) {
            if (icon.startsWith('data:')) {
              href = icon; // Uploaded custom icon (already base64)
              type = icon.startsWith('data:image/jpeg') ? 'image/jpeg' : 'image/png';
            } else if (pngCache) {
              href = pngCache; // SVG converted to PNG
              type = 'image/png';
            } else {
              href = './' + (icon.startsWith('/') ? icon.slice(1) : icon);
              if (href.endsWith('.svg')) {
                type = 'image/svg+xml';
              } else {
                type = 'image/png';
              }
            }
          }
          
          // Inietta apple-touch-icon
          var appleLink = document.createElement('link');
          appleLink.rel = 'apple-touch-icon';
          appleLink.href = href;
          document.head.appendChild(appleLink);
          
          // Assicura che la favicon rimanga sempre ./favicon.png
          var existingFavicon = document.querySelector('link[rel="icon"]');
          if (existingFavicon) {
            existingFavicon.href = './favicon.png';
            existingFavicon.type = 'image/png';
          }
        } catch(e){}
      })();
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
